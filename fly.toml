# fly launch --copy-config --no-deploy && fly volumes create agent_data --size 1 && fly secrets set AGENT_DASH_TOKEN=... && fly deploy
app = "agent-dashboard"
primary_region = "fra"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  AGENT_DB = "/data/agents.db"

[mounts]
  source = "agent_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
