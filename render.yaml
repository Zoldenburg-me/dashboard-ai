services:
  - type: web
    name: agent-dashboard
    runtime: docker
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /healthz
    envVars:
      - key: AGENT_DASH_TOKEN
        generateValue: true
      - key: AGENT_DB
        value: /data/agents.db
    disk:
      name: agent-data
      mountPath: /data
      sizeGB: 1
